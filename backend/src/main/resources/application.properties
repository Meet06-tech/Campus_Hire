spring.application.name=placement-management-api
server.port=${SERVER_PORT:8080}

# PostgreSQL settings are supplied through environment variables.
# The URL default points only to the approved local database; credentials remain external.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/placement_management}
spring.datasource.username=${DB_USERNAME:placement_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.profile-photo.storage-dir=${PROFILE_PHOTO_STORAGE_DIR:./var/uploads/profile-photos}
app.profile-photo.max-size-bytes=${PROFILE_PHOTO_MAX_SIZE_BYTES:5242880}

# Comma-separated, exact domains allowed for provisioned staff email login.
# Blank or absent means staff email login is disabled.
app.auth.staff-allowed-email-domains=${STAFF_ALLOWED_EMAIL_DOMAINS:}

# Replace this development key before sharing or deploying the application.
app.jwt.secret=${JWT_SECRET:development-only-secret-key-change-before-deployment-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

