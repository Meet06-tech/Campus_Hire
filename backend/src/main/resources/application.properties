spring.application.name=placement-management-api
server.port=${SERVER_PORT:8080}

# PostgreSQL settings are supplied through environment variables.
# The application will use these when database-backed features are added.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/placement_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

